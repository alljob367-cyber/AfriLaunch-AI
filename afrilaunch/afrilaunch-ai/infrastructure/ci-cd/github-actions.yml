# AfriLaunch AI — CI/CD Pipeline
# GitHub Actions — Production Ready

name: AfriLaunch AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/afrilaunch
  K8S_NAMESPACE: afrilaunch-prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── 1. Code Quality & Security ────────────────────────────
  quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (Frontend)
        run: npm ci
        working-directory: src/frontend

      - name: Install dependencies (Backend)
        run: npm ci
        working-directory: src/backend/auth-service

      - name: TypeScript Check
        run: npm run type-check
        working-directory: src/frontend

      - name: ESLint
        run: npm run lint
        working-directory: src/frontend

      - name: Prettier Check
        run: npm run format:check
        working-directory: src/frontend

      - name: Python Linting (ruff)
        run: |
          pip install ruff mypy
          ruff check src/backend/ai-orchestrator/
          mypy src/backend/ai-orchestrator/ --ignore-missing-imports

      - name: Security Audit (npm)
        run: npm audit --audit-level=high
        working-directory: src/frontend

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─── 2. Tests ──────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: afrilaunch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Unit Tests (Frontend)
        run: |
          npm ci
          npm run test:coverage
        working-directory: src/frontend
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/afrilaunch_test
          REDIS_URL: redis://localhost:6379

      - name: Run Unit Tests (Auth Service)
        run: |
          npm ci
          npm run test:coverage
        working-directory: src/backend/auth-service
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/afrilaunch_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_for_ci

      - name: Run Python Tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short
        working-directory: src/backend/ai-orchestrator
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/afrilaunch_test

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─── 3. E2E Tests ──────────────────────────────────────────
  e2e:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps
        working-directory: src/frontend

      - name: Run E2E Tests
        run: npm run test:e2e
        working-directory: src/frontend
        env:
          BASE_URL: http://localhost:3000
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  # ─── 4. Build Docker Images ────────────────────────────────
  build:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        service:
          - name: frontend
            context: src/frontend
          - name: auth-service
            context: src/backend/auth-service
          - name: identity-service
            context: src/backend/identity-service
          - name: social-service
            context: src/backend/social-service
          - name: payment-service
            context: src/backend/payment-service
          - name: content-service
            context: src/backend/content-service
          - name: ai-orchestrator
            context: src/backend/ai-orchestrator
          - name: notification-service
            context: src/backend/notification-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

  # ─── 5. Deploy to Staging ──────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, e2e]
    environment:
      name: staging
      url: https://staging.afrilaunch.ai
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config

      - name: Deploy to Staging
        run: |
          IMAGE_TAG=sha-$(git rev-parse --short HEAD)
          kubectl set image deployment/frontend frontend=${{ env.IMAGE_PREFIX }}/frontend:$IMAGE_TAG \
            -n afrilaunch-staging
          kubectl set image deployment/auth-service auth-service=${{ env.IMAGE_PREFIX }}/auth-service:$IMAGE_TAG \
            -n afrilaunch-staging
          kubectl set image deployment/ai-orchestrator ai-orchestrator=${{ env.IMAGE_PREFIX }}/ai-orchestrator:$IMAGE_TAG \
            -n afrilaunch-staging
          kubectl rollout status deployment/frontend -n afrilaunch-staging --timeout=300s

      - name: Run Smoke Tests
        run: |
          sleep 30
          curl -f https://staging.afrilaunch.ai/api/health || exit 1

  # ─── 6. Deploy to Production ───────────────────────────────
  deploy-production:
    name: 🌍 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: production
      url: https://afrilaunch.ai
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Deploy to Production
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          for service in frontend auth-service identity-service social-service \
                         payment-service content-service ai-orchestrator notification-service; do
            kubectl set image deployment/$service $service=${{ env.IMAGE_PREFIX }}/$service:$IMAGE_TAG \
              -n ${{ env.K8S_NAMESPACE }}
          done

      - name: Wait for Rollout
        run: |
          for service in frontend auth-service ai-orchestrator; do
            kubectl rollout status deployment/$service \
              -n ${{ env.K8S_NAMESPACE }} --timeout=600s
          done

      - name: Smoke Tests
        run: |
          sleep 60
          curl -f https://afrilaunch.ai/api/health || exit 1
          curl -f https://api.afrilaunch.ai/auth/health || exit 1

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} AfriLaunch AI déployé en production — Version ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─── 7. Post-Deploy Monitoring ─────────────────────────────
  monitor:
    name: 📊 Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Wait and Verify
        run: |
          sleep 120
          # Health checks
          curl -f https://afrilaunch.ai/api/health
          curl -f https://api.afrilaunch.ai/auth/health
          curl -f https://api.afrilaunch.ai/ai/health
          echo "✅ All services healthy!"
