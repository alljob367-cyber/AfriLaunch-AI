# AfriLaunch AI — Kubernetes Manifests (Production)
# Namespace: afrilaunch-prod

---
apiVersion: v1
kind: Namespace
metadata:
  name: afrilaunch-prod
  labels:
    app: afrilaunch-ai
    environment: production

---
# ─── ConfigMap ────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: afrilaunch-config
  namespace: afrilaunch-prod
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  KAFKA_BROKERS: "kafka-service:9092"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

---
# ─── Auth Service Deployment ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: afrilaunch-prod
  labels:
    app: auth-service
    tier: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
        version: v1
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: auth-service
      containers:
        - name: auth-service
          image: ghcr.io/afrilaunch/auth-service:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: afrilaunch-config
            - secretRef:
                name: afrilaunch-secrets
          env:
            - name: PORT
              value: "3001"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: auth-service
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: afrilaunch-prod
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  type: ClusterIP

---
# ─── AI Orchestrator Deployment ───────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
  namespace: afrilaunch-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-orchestrator
  template:
    metadata:
      labels:
        app: ai-orchestrator
    spec:
      containers:
        - name: ai-orchestrator
          image: ghcr.io/afrilaunch/ai-orchestrator:${IMAGE_TAG}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: afrilaunch-config
            - secretRef:
                name: afrilaunch-secrets
          env:
            - name: PORT
              value: "8000"
            - name: WORKERS
              value: "4"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator-service
  namespace: afrilaunch-prod
spec:
  selector:
    app: ai-orchestrator
  ports:
    - port: 8000
      targetPort: 8000

---
# ─── Frontend Deployment ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: afrilaunch-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/afrilaunch/frontend:${IMAGE_TAG}
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: afrilaunch-config
            - secretRef:
                name: afrilaunch-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: afrilaunch-prod
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000

---
# ─── Ingress (avec cert-manager pour SSL auto) ────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: afrilaunch-ingress
  namespace: afrilaunch-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - afrilaunch.ai
        - api.afrilaunch.ai
      secretName: afrilaunch-tls
  rules:
    - host: afrilaunch.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: api.afrilaunch.ai
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: ai-orchestrator-service
                port:
                  number: 8000

---
# ─── HPA (Auto-scaling) ───────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: afrilaunch-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-orchestrator-hpa
  namespace: afrilaunch-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-orchestrator
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
